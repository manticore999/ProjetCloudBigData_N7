---
- name: Utilisateur système prometheus
  ansible.builtin.user:
    name: prometheus
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Dossiers Prometheus
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: prometheus
    group: prometheus
    mode: "0755"
  loop:
    - /etc/prometheus
    - "{{ data_mount }}/prometheus"

- name: Télécharger Prometheus {{ prometheus_version }}
  ansible.builtin.get_url:
    url: "https://github.com/prometheus/prometheus/releases/download/v{{ prometheus_version }}/prometheus-{{ prometheus_version }}.linux-amd64.tar.gz"
    dest: "{{ download_dir }}/prometheus-{{ prometheus_version }}.tar.gz"
    checksum: "sha256:{{ prometheus_sha256 }}"

- name: Décompresser Prometheus
  ansible.builtin.unarchive:
    src: "{{ download_dir }}/prometheus-{{ prometheus_version }}.tar.gz"
    dest: /opt
    remote_src: true
    creates: "/opt/prometheus-{{ prometheus_version }}.linux-amd64/prometheus"

- name: Configuration Prometheus (cibles = tous les nœuds)
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: /etc/prometheus/prometheus.yml
    mode: "0644"
  register: prometheus_config

- name: Unité systemd Prometheus
  ansible.builtin.copy:
    dest: /etc/systemd/system/prometheus.service
    mode: "0644"
    content: |
      [Unit]
      Description=Prometheus
      After=network-online.target data.mount

      [Service]
      User=prometheus
      ExecStart=/opt/prometheus-{{ prometheus_version }}.linux-amd64/prometheus \
        --config.file=/etc/prometheus/prometheus.yml \
        --storage.tsdb.path={{ data_mount }}/prometheus \
        --storage.tsdb.retention.time={{ prometheus_retention }} \
        --web.listen-address=0.0.0.0:9090
      Restart=on-failure

      [Install]
      WantedBy=multi-user.target
  register: prometheus_unit

- name: Démarrer Prometheus
  ansible.builtin.systemd:
    name: prometheus
    state: "{{ 'restarted' if (prometheus_unit.changed or prometheus_config.changed) else 'started' }}"
    enabled: true
    daemon_reload: true
