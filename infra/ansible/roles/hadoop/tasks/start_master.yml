---
- name: Formater le NameNode (une seule fois)
  ansible.builtin.command: "{{ hadoop_home }}/bin/hdfs namenode -format -nonInteractive -clusterid {{ cluster_name }}"
  args:
    creates: "{{ data_mount }}/hdfs/namenode/current/VERSION"
  become_user: "{{ bigdata_user }}"
  environment: "{{ bigdata_env }}"

- name: Démarrer NameNode et ResourceManager
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: started
    enabled: true
    daemon_reload: true
  loop:
    - hdfs-namenode
    - yarn-resourcemanager

- name: Attendre les ports RPC (HDFS 9000, YARN 8032)
  ansible.builtin.wait_for:
    host: "{{ private_ip }}"
    port: "{{ item }}"
    timeout: 180
  loop: [9000, 8032]
