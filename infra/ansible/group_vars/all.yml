# =============================================================================
# Configuration COMMUNE du cluster. Toute modification passe par une PR :
# deux clusters avec des valeurs différentes ne sont plus comparables.
# =============================================================================

cluster_name: cbench
master_host: "{{ groups['master'][0] }}"

# --- Versions figées (+ empreintes officielles) ------------------------------
java_package: openjdk-17-jdk-headless
java_home: /usr/lib/jvm/java-17-openjdk-amd64

hadoop_version: "3.5.0"
hadoop_sha512: 04ab94496cc00c8b7a28d03f6308eff8d2a4e7f37a9da5e8e086e4d6fc990e7a94d661908f6a6136039536efb362614b8aecdef185b5fb8ed588f0b152c7aa16

spark_version: "4.1.4"
spark_package: "spark-{{ spark_version }}-bin-hadoop3"
spark_sha512: 1461b6c425d290913e7be97bfec738abc843c663d177dc57e32b82874d20144ed67dcca692a57efc4e5b40d2f001ee0e9e0d2d7b088ae58f5378ecac92739076

node_exporter_version: "1.13.1"
node_exporter_sha256: 5c00c5234f1ee45900b25539a5a0ab82146a098c15c16a4ec3bc855b597a6477

prometheus_version: "3.16.0"
prometheus_sha256: 68727009472a2c02e1ff7f062fd5b3e637285bffc8fc2d340c76fb449d6e0f34

apache_cdn: https://dlcdn.apache.org
apache_archive: https://archive.apache.org/dist

# --- Chemins -----------------------------------------------------------------
hadoop_home: /opt/hadoop
hadoop_conf_dir: "{{ hadoop_home }}/etc/hadoop"
spark_home: /opt/spark
bench_dir: /opt/bench
download_dir: /opt/src

data_device: /dev/disk/by-id/google-data
data_mount: /data

bigdata_user: hadoop

bigdata_env:
  JAVA_HOME: "{{ java_home }}"
  HADOOP_HOME: "{{ hadoop_home }}"
  HADOOP_CONF_DIR: "{{ hadoop_conf_dir }}"
  YARN_CONF_DIR: "{{ hadoop_conf_dir }}"
  SPARK_HOME: "{{ spark_home }}"
  PATH: "{{ hadoop_home }}/bin:{{ spark_home }}/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"

# --- HDFS --------------------------------------------------------------------
hdfs_replication: 2          # 3 workers : 2 copies limite l'amplification d'écriture
hdfs_block_size: 134217728   # 128 Mo

# --- Ressources (dimensionnées pour des workers n2-standard-2 : 2 vCPU / 8 Go)
namenode_heap: 1g
resourcemanager_heap: 1g
datanode_heap: 512m
nodemanager_heap: 512m

yarn_nm_memory_mb: 6144      # 8 Go - OS - DataNode - NodeManager
yarn_nm_vcores: 2

spark_executor_instances: "{{ groups['workers'] | length }}"  # 1 exécuteur par worker
spark_executor_cores: 2
spark_executor_memory: 4g
spark_executor_memory_overhead: 768m
spark_driver_memory: 2g
spark_sql_shuffle_partitions: 96

# --- Monitoring --------------------------------------------------------------
prometheus_scrape_interval: 2s
prometheus_retention: 120d
grafana_enabled: true

# --- Réduction du bruit de fond pendant les mesures ---------------------------
noisy_units:
  - unattended-upgrades.service
  - apt-daily.timer
  - apt-daily.service
  - apt-daily-upgrade.timer
  - apt-daily-upgrade.service
  - man-db.timer
  - fstrim.timer
  - motd-news.timer
  - e2scrub_all.timer
  - dpkg-db-backup.timer
  - logrotate.timer
  - update-notifier-download.timer
  - update-notifier-motd.timer
